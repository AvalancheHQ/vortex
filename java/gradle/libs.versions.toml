[versions]
errorprone = "2.36.0"
guava = "33.4.8-jre"
guava-failureaccess = "1.0.3"
guava-listenablefuture = "9999.0-empty-to-avoid-conflict-with-guava"
nopen = "1.0.1"
spark = "3.5.6"
immutables = "2.11.2"
protobuf = "4.31.1"
arrow = "18.3.0"
junit = "5.13.4"
slf4j = "2.0.17"
logback = "1.5.18"

[libraries]
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
guava-failureaccess = { module = "com.google.guava:failureaccess", version.ref = "guava-failureaccess" }
guava-listenablefuture = { module = "com.google.guava:listenablefuture", version.ref = "guava-listenablefuture" }
nopen-checker = { module = "com.jakewharton.nopen:nopen-checker", version.ref = "nopen" }
nopen-annotations = { module = "com.jakewharton.nopen:nopen-annotations", version.ref = "nopen" }
immutables-value = { module = "org.immutables:value", version.ref = "immutables" }
protobuf = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

# Logging
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Spark libraries (expand wildcard as needed)
spark-catalyst = { module = "org.apache.spark:spark-catalyst_2.12", version.ref = "spark" }
spark-sql = { module = "org.apache.spark:spark-sql_2.12", version.ref = "spark" }

# Arrow libraries (expand wildcard as needed)  
arrow-vector = { module = "org.apache.arrow:arrow-vector", version.ref = "arrow" }
arrow-c-data = { module = "org.apache.arrow:arrow-c-data", version.ref = "arrow" }
arrow-memory-core = { module = "org.apache.arrow:arrow-memory-core", version.ref = "arrow" }
arrow-memory-netty = { module = "org.apache.arrow:arrow-memory-netty", version.ref = "arrow" }

# Test dependencies
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
